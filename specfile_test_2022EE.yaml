categories:
  topmatched:
    processes:
      - singletop
      - ttWZ
      - ttbar
    cut: preselectedHOTVRJets_has_hadronicTop_topIsInside
    colour: 2
  wmatched:
    processes:
      - singletop
      - ttWZ
      - ttbar
    cut: "( (preselectedHOTVRJets_has_hadronicW_fromTop_topIsInside || preselectedHOTVRJets_has_b_plus_quark_fromTop_topIsInside || preselectedHOTVRJets_has_hadronicW_not_fromTop || preselectedHOTVRJets_has_b_plus_quark_not_fromTop) && !(preselectedHOTVRJets_has_hadronicTop_topIsInside) )"
    colour: 797
  nonmatched:
    processes:
      - singletop
      - ttWZ
      - ttbar
    cut: "( !(preselectedHOTVRJets_has_hadronicW_fromTop_topIsInside || preselectedHOTVRJets_has_b_plus_quark_fromTop_topIsInside || preselectedHOTVRJets_has_hadronicW_not_fromTop || preselectedHOTVRJets_has_b_plus_quark_not_fromTop) && !(preselectedHOTVRJets_has_hadronicTop_topIsInside) )"
    colour: 867
  other:
    processes:
      - qcd
      - diboson
      - wjets
    cut: "1"
    colour: 921
tagger:
  name: HOTVRtagger_bdt
  varname: preselectedHOTVRJets_scoreBDT
  cut: 0.5
  #name: HOTVRtagger_cut
  #varname: passedHOTVRCut
  #cut: 0.5
distribution:
  #mass_variable: fj_1_rawmass
  #mass_range: [50, 220]
  variables:
  - variable: fj_1_rawmass
    range: [50, 220]
    bins: 17
  #- variable: fj_1_pt
  #  range: [200, 1200]
  #  bins: 50
  #- variable: muon_pt
  #  range: [0, 500]
  #  bins: 50
  #- variable: preselectedHOTVRJets_scoreBDT
  #  range: [0, 1]
  #  bins: 50
  #- variable: preselectedHOTVRJets_fractional_subjet_pt
  #  range: [0, 1]
  #  bins: 50
  #- variable: preselectedHOTVRJets_min_pairwise_subjets_mass
  #  range: [0, 1000]
  #  bins: 50
  #- variable: preselectedHOTVRJets_mass
  #  range: [0, 500]
  #  bins: 50
  #- variable: preselectedHOTVRJets_nsubjets
  #  range: [-0.5, 3.5]
  #  bins: 4
  #- variable: preselectedHOTVRJets_tau3_over_tau2
  #  range: [0, 1.5]
  #  bins: 75
  #- variable: leptonicW_pt
  #  range: [0, 500]
  #  bins: 50
  #mass_variable: fj_1_pt
  #mass_range: [200, 1200]
  #mass_bins: 50
  event_categories:
  - name: 300to400
    rule: "(fj_1_pt >= 300) && (fj_1_pt < 400)"
  - name: 400to480
    rule: "(fj_1_pt >= 400) && (fj_1_pt < 480)"
  - name: 480to600
    rule: "(fj_1_pt >= 480) && (fj_1_pt < 600)"
  - name: 600to1200
    rule: "(fj_1_pt >= 600) && (fj_1_pt < 1200)"
  #- name: pt_diags
  #  rule: "(fj_1_pt >= 200) && (fj_1_pt < 1200)"
uncertainties:
  lumi:
    mode: "lnN"
    size: 1.014
  topmatched_xsec:
    mode: "lnN"
    category: topmatched
    size: 1.05
  wmatched_xsec:
    mode: "lnN"
    category: wmatched
    size: 1.05
  nonmatched_xsec:
    mode: "lnN"
    category: nonmatched
    size: 1.05
  other_xsec:
    mode: "lnN"
    category: other
    size: 2.00
  pu:
    mode: "factor"
    up: "puWeightUp/puWeight"
    down: "puWeightDown/puWeight"
  JES:
    mode: "file"
    lowess:
      symmetrize: true
      limit: 0.5
  JER:
    mode: "file"
    lowess:
      symmetrize: true
      limit: 0.5
  MET:
    mode: "file"
  isr:
    mode: "factor"
    up: "PSWeight[0]"
    down: "PSWeight[2]"
  fsr:
    mode: "factor"
    up: "PSWeight[1]"
    down: "PSWeight[3]"
  lhescalemuf:
    mode: "factor"
    up: "(LHEScaleWeight[5]*LHEScaleWeightNorm[5])/(LHEScaleWeight[4]*LHEScaleWeightNorm[4])"
    down: "(LHEScaleWeight[3]*LHEScaleWeightNorm[3])/(LHEScaleWeight[4]*LHEScaleWeightNorm[4])"
  lhescalemur:
    mode: "factor"
    up: "(LHEScaleWeight[7]*LHEScaleWeightNorm[7])/(LHEScaleWeight[4]*LHEScaleWeightNorm[4])"
    down: "LHEScaleWeight[1]*LHEScaleWeightNorm[1]/(LHEScaleWeight[4]*LHEScaleWeightNorm[4])"