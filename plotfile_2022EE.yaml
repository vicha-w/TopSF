savedir: "HOTVRtagger_TopSF_2022EE_withlowess"
com: 13.6
categories:
  topmatched:
    color: "#e42536"
    propername: "Top-matched"
  wmatched:
    color: "#f89c20"
    propername: "Semi-matched"
  nonmatched:
    color: "#5790fc"
    propername: "Non-matched"
  other:
    color: "#964a8b"
    propername: "Other"
eventcats:
